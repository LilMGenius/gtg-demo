<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d110c">
<meta name="description" content="동네 운동장 방치형 골키퍼 키우기. 막아도 안 끝난다, 끝까지 봐야 안다.">
<title>골키퍼 키우기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ffd83d%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%228%22 fill=%22%2312160e%22/%3E%3C/svg%3E">
<style>@font-face{font-family:'Black Han Sans';font-style:normal;font-weight:400;src:url(assets/fonts/black-han-sans.ttf) format('truetype');font-display:block}</style>
<link rel="stylesheet" href="src/ui/hud.css">
<link rel="stylesheet" href="src/ui/title.css">
</head>
<body>
<canvas id="stage"></canvas>
<div id="flash"></div>
<div id="stamp"></div>

<div id="hud">
  <div id="top">
    <div id="lv">Lv 1</div>
    <div id="form"></div>
    <div id="pips"></div>
    <div id="fans"></div>
  </div>
  <div id="caption"></div>
  <div id="pad">
    <button class="zone" data-dive="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15.7 4.4C13.1 7.1 9.7 10.1 7.8 12.2c1.7 1.9 4.8 4.9 7.4 7.3"/><path d="M8.1 12.1c1.1-.2 2.3-.5 3.2-.9"/></svg></button>
    <button class="zone" data-dive="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12.4 19.7c-.5-3.7-.3-9.5-.3-13.6"/><path d="M6.1 12.5C8.3 10.2 10.5 7.8 12.1 5.9c1.8 1.9 4 4.4 5.9 6.4"/></svg></button>
    <button class="zone" data-dive="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8.4 4.6c2.5 2.6 5.8 5.5 7.8 7.5-1.7 2-4.9 5.1-7.5 7.4"/><path d="M16 12.1c-1.1-.3-2.2-.7-3.1-1.1"/></svg></button>
  </div>
  <button id="mute" aria-pressed="false" aria-label="소리 끄기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M19 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M4 20 20 4"/></svg>
  </button>
  <button id="out">나가기</button>
  <button id="auto">자동</button>
  <div id="offer" hidden></div>
</div>

<div id="title">
  <div id="mark">
    <span id="kicker">동네 운동장 방치형</span>
    <h1 id="word"><span>골키퍼</span><span>키우기</span></h1>
    <p id="tag">막아도 안 끝난다. 끝까지 봐야 안다</p>
    <button id="go">시작</button>
  </div>

  <div id="help">
    <button id="helpBtn" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9.2 9a2.9 2.9 0 1 1 3.9 2.7c-.7.3-1.1 1-1.1 1.8v.4"/><circle cx="12" cy="18" r="1.15" fill="currentColor" stroke="none"/></svg>
      조작법
    </button>
    <div id="helpPanel" hidden>
      <ul>
        <li>
          <svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linejoin="round"><rect x="4" y="11" width="40" height="26" rx="4" stroke="#ffd83d"/><path d="M17.3 11v26M30.7 11v26" stroke="#5d6957"/><circle cx="10.6" cy="24" r="2.6" fill="#ffd83d" stroke="none"/><circle cx="37.4" cy="24" r="2.6" fill="#ffd83d" stroke="none"/></svg>
          <div><b>화면 세 칸을 누른다</b><small>왼쪽·가운데·오른쪽. 공이 올 곳을 찍는다</small></div>
        </li>
        <li>
          <svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="25" r="12" stroke="#4fd08a"/><path d="M24 7v4M9 13l3 3M39 13l-3 3" stroke="#4fd08a"/><path d="M24 18v7l5 3" stroke="#f2f4f0"/></svg>
          <div><b>타이밍이 전부다</b><small>너무 빠르면 역동작, 너무 늦으면 손이 안 닿는다</small></div>
        </li>
        <li>
          <svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="10" r="4.5" stroke="#e0563f"/><path d="M24 41V19" stroke="#e0563f"/><path d="M16 27l8-8 8 8" stroke="#e0563f"/></svg>
          <div><b>뛰쳐나가기</b><small>각을 좁히러 나간다. 뚫리면 골대가 빈다</small></div>
        </li>
      </ul>
      <div class="keys">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#7e8878" stroke-width="2" stroke-linejoin="round"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M12 6v3"/><path d="M6 12v5a6 6 0 0 0 12 0v-5"/></svg>
        마우스도 같은 세 칸
        <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd> 키보드도 된다
      </div>
    </div>
  </div>
</div>

<div id="rotate">
  <svg viewBox="0 0 64 64" fill="none" stroke="#ffd83d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="6" width="24" height="40" rx="4"/><path d="M14 50a24 24 0 0 0 36 0"/><path d="M8 44l6 6 6-6"/></svg>
  <p>가로로 돌려주세요</p>
  <small>골대는 좌우로 길다. 세로로는 좌우가 안 보인다</small>
</div>

<script type="module" src="src/main.mjs"></script>
</body>
</html>
